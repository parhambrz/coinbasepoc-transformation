version: 2
models:
  - name: market_ticks
    description: Canonical deduplicated market tick fact, with measurements, forecast context, and ingestion lineage.
    columns:
      - name: snapshot_id
        data_tests: [not_null, unique]
      - name: tick_ts
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
      - name: feed_status
        data_tests: [not_null]
      - name: bid_price
        data_tests:
          - not_null:
              config:
                where: "feed_status = 'healthy'"
      - name: ask_price
        data_tests:
          - not_null:
              config:
                where: "feed_status = 'healthy'"
      - name: mid_price
        data_tests:
          - not_null:
              config:
                where: "feed_status = 'healthy'"
      - name: spread
        data_tests:
          - not_null:
              config:
                where: "feed_status = 'healthy'"
