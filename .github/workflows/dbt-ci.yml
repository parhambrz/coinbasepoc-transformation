name: dbt-ci
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: dbt-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ci:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: profiles
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE_CI: ${{ secrets.SNOWFLAKE_ROLE_CI }}
      SNOWFLAKE_DATABASE_CI: COINBASEPOC_CI
      SNOWFLAKE_WAREHOUSE_CI: ${{ secrets.SNOWFLAKE_WAREHOUSE_CI }}
      SNOWFLAKE_SCHEMA_CI: PR_${{ github.event.pull_request.number }}
      COINBASE_RAW_DATABASE: ${{ vars.COINBASE_RAW_DATABASE || 'COINBASEPOC' }}
      COINBASE_RAW_SCHEMA: ${{ vars.COINBASE_RAW_SCHEMA || 'INGEST' }}
      COINBASE_RAW_TABLE: ${{ vars.COINBASE_RAW_TABLE || 'RAW_STREAM' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt
        run: python -m pip install "dbt-core==1.11.12" "dbt-snowflake==1.11.6"
      - name: Write Snowflake private key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.snowflake"
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$HOME/.snowflake/rsa_key.p8"
          chmod 600 "$HOME/.snowflake/rsa_key.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$HOME/.snowflake/rsa_key.p8" >> "$GITHUB_ENV"
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      - name: Validate CI settings
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SNOWFLAKE_ACCOUNT" && -n "$SNOWFLAKE_USER" && -n "$SNOWFLAKE_ROLE_CI" && -n "$SNOWFLAKE_WAREHOUSE_CI" ]]
          [[ "$SNOWFLAKE_SCHEMA_CI" =~ ^PR_[1-9][0-9]*$ ]]
          [[ -s "$SNOWFLAKE_PRIVATE_KEY_PATH" ]]
      - run: cp profiles/profiles.template.yml profiles/profiles.yml
      - run: dbt debug --target ci --profiles-dir profiles
      - run: dbt parse --target ci --profiles-dir profiles
      - run: dbt build --target ci --profiles-dir profiles
      - run: dbt docs generate --target ci --profiles-dir profiles
      - uses: actions/upload-artifact@v4
        with:
          name: dbt-ci-artifacts-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          retention-days: 14
          path: target/manifest.json
